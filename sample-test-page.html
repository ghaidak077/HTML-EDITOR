<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sample Page</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
    .hero { padding: 60px 20px; text-align: center; background: #222; color: #fff; }
    .hero h1 { font-size: 32px; margin: 0 0 10px; }
    .hero p { font-size: 16px; color: #ccc; }
    .cta { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #4f8cff; color: #fff; text-decoration: none; border-radius: 4px; }
    .section { padding: 40px 20px; max-width: 700px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Sample Headline</h1>
    <p>A short description used to test text editing.</p>
    <a href="#" class="cta">Click Me</a>
  </div>
  <div class="section">
    <p>This is a paragraph inside a section, for testing selection and style changes.</p>
  </div>
</body>
</html>
